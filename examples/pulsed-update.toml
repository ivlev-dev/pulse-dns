# Минимальный пример authoritative `pulsed` с RFC 2136 DNS UPDATE.
#
# Клиент (nsupdate-совместимый):
#   nsupdate -y hmac-sha256:update-key.example.:c2VjcmV0LWJhc2U2NA== <<'DNS'
#   server 127.0.0.1 5353
#   zone example.com.
#   update add host.example.com. 300 A 192.0.2.50
#   send
#   DNS
listen_udp = "127.0.0.1:5353"
listen_tcp = "127.0.0.1:5353"
workers = 1
zonefile = "/tmp/pulse-dns-update.zonefile"
map_size = 268435456
durability = "flush"

# Ключ объявляется один раз; transfer/update ссылаются на него по имени.
[[tsig_keys]]
name = "update-key.example."
algorithm = "hmac-sha256"
secret = "c2VjcmV0LWJhc2U2NA=="

[update]
enabled = true
require_tsig = true
allow_from = ["127.0.0.1/32", "::1/128"]
allow_zones = ["example.com."]
tsig_keys = ["update-key.example."]

# Управляемые ключи (REST /api/v1/tsig-keys): состояние 0600, SIGHUP reload.
# tsig_state_file = "/var/lib/pulsed/tsig-keys.json"

# Per-name политика: первое совпадение побеждает; при непустом списке
# операция без grant запрещена.
# [[update.policy]]
# principal = { tsig_key = "update-key.example." }
# zone = { exact = "example.com." }
# name = { suffix = "example.com." }
# types = ["A", "AAAA"]
# action = "grant"
#
# [[update.policy]]
# principal = { subnet = "192.0.2.0/24" }
# zone = "any"
# name = { wildcard = "*.example.com." }
# types = "any"
# action = "deny"

# SIG(0) как альтернатива TSIG (RFC 2931).
# [[update.sig0_keys]]
# name = "host.example.com."
# algorithm = "ed25519"
# public_key = "BASE64_DNSKEY_PUBLIC_KEY"
# key_tag = 12345
# private_key = "/etc/pulsed/sig0.private"
