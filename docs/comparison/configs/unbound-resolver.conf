server:
    interface: 127.0.0.1@5402
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    num-threads: 4
    so-reuseport: yes
    verbosity: 1
    use-syslog: no
    logfile: "/tmp/opencode/compare/logs/unbound-resolver.log"
    log-time-ascii: yes
    pidfile: ""
    username: ""
    chroot: ""
    directory: "/tmp/opencode/compare/run/unbound-resolver"
    do-daemonize: no
    access-control: 127.0.0.0/8 allow
    hide-identity: yes
    hide-version: yes
    do-not-query-localhost: no
    qname-minimisation: no
    prefetch: no
    cache-min-ttl: 0
    cache-max-ttl: 86400
    msg-cache-size: 128m
    rrset-cache-size: 256m
    neg-cache-size: 32m
    module-config: "iterator"
    local-zone: "test." nodefault
    local-zone: "bench.test." nodefault

forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5301
