options {
    directory "/tmp/opencode/compare/run/bind-resolver";
    pid-file "/tmp/opencode/compare/run/bind-resolver/named.pid";
    listen-on port 5403 { 127.0.0.1; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { 127.0.0.0/8; };
    allow-query { any; };
    forward only;
    forwarders { 127.0.0.1 port 5301; };
    dnssec-validation no;
    minimal-responses no;
    querylog no;
    max-cache-ttl 86400;
    max-ncache-ttl 86400;
    managed-keys-directory "/tmp/opencode/compare/run/bind-resolver";
};
