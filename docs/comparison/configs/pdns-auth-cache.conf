launch=gsqlite3
gsqlite3-database=/tmp/opencode/compare/run/pdns/pdns.sqlite3
gsqlite3-pragma-synchronous=0
local-address=127.0.0.1
local-port=5306
daemon=no
guardian=no
cache-ttl=60
query-cache-ttl=60
negquery-cache-ttl=60
distributor-threads=4
receiver-threads=4
reuseport=yes
loglevel=3
log-dns-queries=no
log-timestamp=yes
socket-dir=/tmp/opencode/compare/run/pdns
setuid=
setgid=
disable-syslog=yes
