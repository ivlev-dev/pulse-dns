options {
    directory "/tmp/opencode/compare/run/bind-auth";
    pid-file "/tmp/opencode/compare/run/bind-auth/named.pid";
    listen-on port 5302 { 127.0.0.1; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    minimal-responses no;
    querylog no;
    managed-keys-directory "/tmp/opencode/compare/run/bind-auth";
};

zone "example.com." {
    type primary;
    file "/tmp/opencode/compare/zones/example.com.zone";
};

zone "z0.bench.test." {
    type primary;
    file "/tmp/opencode/compare/zones/z0.bench.test.zone";
};
