server:
    interface: 127.0.0.1@5303
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    num-threads: 4
    so-reuseport: yes
    verbosity: 1
    use-syslog: no
    logfile: "/tmp/opencode/compare/logs/unbound-auth.log"
    log-time-ascii: yes
    pidfile: ""
    username: ""
    chroot: ""
    directory: "/tmp/opencode/compare/run/unbound-auth"
    do-daemonize: no
    access-control: 127.0.0.0/8 allow
    hide-identity: yes
    hide-version: yes
    qname-minimisation: no
    aggressive-nsec: no
    prefetch: no
    cache-min-ttl: 0
    cache-max-ttl: 86400
    msg-cache-size: 64m
    rrset-cache-size: 128m
    module-config: "iterator"
    local-zone: "test." nodefault
    local-zone: "bench.test." nodefault

auth-zone:
    name: "example.com."
    zonefile: "/tmp/opencode/compare/zones/example.com.zone"
    fallback-enabled: no

auth-zone:
    name: "z0.bench.test."
    zonefile: "/tmp/opencode/compare/zones/z0.bench.test.zone"
    fallback-enabled: no
