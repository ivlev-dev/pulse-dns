[package]
name = "pulse-api"
description = "Control-plane REST API (v1 subset) for pulse-dns zones and rrsets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
pulse-dns = { path = "../pulse-dns" }
pulse-dnssec = { path = "../pulse-dnssec" }
pulse-master = { path = "../pulse-master" }
rustix = { version = "1", features = ["thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
