[package]
name = "pulsed"
description = "Authoritative DNS server binary: config, zone loading, UDP/TCP transports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "pulsed"
path = "src/lib.rs"

[[bin]]
name = "pulsed"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
hex = "0.4"
pulse-api = { path = "../pulse-api" }
pulse-dns = { path = "../pulse-dns" }
pulse-dnscrypt = { path = "../pulse-dnscrypt" }
pulse-dnssec = { path = "../pulse-dnssec" }
pulse-master = { path = "../pulse-master" }
pulse-runtime = { path = "../pulse-runtime" }
pulse-server = { path = "../pulse-server", features = ["testkit"] }
pulse-tls = { path = "../pulse-tls", features = ["http2", "http3", "doq"] }
pulse-transfer = { path = "../pulse-transfer" }
pulse-zonefile = { path = "../pulse-zonefile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
bytes = "1"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }

[[bench]]
name = "zone_writes"
harness = false

[lints]
workspace = true
