[package]
name = "pulse-resolver"
description = "Caching DNS resolver for pulse-dns: iterative/forward resolution, cache, blocklist and overrides"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
getrandom = "0.4"
pulse-dns = { path = "../pulse-dns" }
pulse-dnssec = { path = "../pulse-dnssec" }
pulse-tls = { path = "../pulse-tls" }
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
thiserror = "2"
webpki-roots = "1"

[dev-dependencies]
criterion = "0.5"
dhat = "0.3"
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
tempfile = "3"

[[bench]]
name = "resolver"
harness = false

[[bench]]
name = "latency"
harness = false

[lints]
workspace = true
