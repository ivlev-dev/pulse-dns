[package]
name = "pulseresolved"
description = "Caching DNS resolver binary: forward/iterative, UDP/TCP, blocklist, overrides, metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "pulseresolved"
path = "src/lib.rs"

[[bin]]
name = "pulseresolved"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
pulse-dns = { path = "../pulse-dns" }
pulse-resolver = { path = "../pulse-resolver" }
pulse-runtime = { path = "../pulse-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"

[dev-dependencies]
pulse-dnssec = { path = "../pulse-dnssec" }
tempfile = "3"

[lints]
workspace = true
