[package]
name = "pulse-tls"
description = "DNS over TLS (RFC 7858), DNS over HTTPS/1.1-2-3 (RFC 8484) and DNS over QUIC servers for pulse-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# DoH over HTTP/2 (RFC 9113) на tokio + h2 + tokio-rustls.
http2 = ["dep:bytes", "dep:h2", "dep:http"]
# DNS over QUIC (RFC 9250) на quinn.
doq = ["dep:quinn"]
# DoH over HTTP/3 (RFC 9114 + RFC 8484) на quinn + h3.
http3 = [
    "dep:bytes",
    "dep:h3",
    "dep:h3-quinn",
    "dep:http",
    "dep:quinn",
]
# Псевдоним `http3`: DoH/3.
doh3 = ["http3"]

[dependencies]
base64 = "0.22"
httparse = "1.10"
pulse-dns = { path = "../pulse-dns" }
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1.16", default-features = false, features = ["std"] }
thiserror = "2"
webpki-roots = "1"

bytes = { version = "1", optional = true }
h2 = { version = "0.4", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = { version = "1", optional = true }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }

[dev-dependencies]
criterion = "0.5"
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }

[[bench]]
name = "tls"
harness = false

[[bench]]
name = "async_transports"
harness = false
required-features = ["http2", "doq"]

[[bench]]
name = "doh3"
harness = false
required-features = ["http3"]

[[test]]
name = "doh_h2"
required-features = ["http2"]

[[test]]
name = "doh3"
required-features = ["http3"]

[[test]]
name = "doq"
required-features = ["doq"]

[[test]]
name = "parallel_features"
required-features = ["http2", "doq"]

[lints]
workspace = true
