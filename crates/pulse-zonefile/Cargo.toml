[package]
name = "pulse-zonefile"
description = "Формат файла зон pulse (v1): superblock, meta, reader table, pager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
crc32c = "0.6"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs", "process", "time"] }
thiserror = "2"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
static_assertions = "1"
tempfile = "3"

[[bench]]
name = "tree"
harness = false

[[bench]]
name = "perf"
harness = false

[lints]
workspace = true
