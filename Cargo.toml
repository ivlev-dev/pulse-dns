[workspace]
members = [
    "crates/pulse-dns",
    "crates/pulse-dnssec",
    "crates/pulse-runtime",
    "crates/pulse-server",
    "crates/pulse-resolver",
    "crates/pulse-zonefile",
    "crates/pulse-api",
    "crates/pulsed",
    "crates/pulse-master",
    "crates/pulse-transfer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ivlev-dev/pulse-dns"
authors = ["Alex Ivlev <ai@itegroup.ru>"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
